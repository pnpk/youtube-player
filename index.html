<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="練習">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css?v=90f72c7a22">
<title>練習プレーヤー</title>
</head>
<body>
<div id="toast" class="toast" role="status" hidden></div>

<div id="history" class="history" role="dialog" aria-label="再生履歴" hidden>
  <div class="history-head">
    <h2>履歴</h2>
    <button id="history-close" aria-label="閉じる">×</button>
  </div>
  <p id="history-empty" class="history-empty">まだ履歴はありません</p>
  <ul id="history-list" class="history-list"></ul>
</div>

<section class="media">
  <form id="load-form" class="load-form">
    <div class="url-field">
      <input id="url" type="text" inputmode="url" placeholder="YouTube の URL を貼り付け" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" id="url-clear" class="url-clear" aria-label="URL を消す">×</button>
    </div>
    <button type="submit">読み込む</button>
    <button type="button" id="history-open">履歴</button>
  </form>
  <div class="video"><div id="player"></div></div>
  <div class="seek-row">
    <div id="seek" class="seek">
      <div id="seek-range" class="seek-range" hidden></div>
      <div id="seek-section" class="seek-section" hidden></div>
      <div id="seek-marks"></div>
      <div id="seek-head" class="seek-head"></div>
    </div>
    <button id="clear-loop" class="clear" aria-label="ループ解除" hidden>×</button>
  </div>
  <div class="readout"><span id="time">0:00.0</span><span id="ab-label">A — / B —</span></div>
</section>

<main class="controls">
  <div class="row row-transport">
    <button id="rewind">⟲ 3秒</button>
    <button id="play" class="play" aria-label="再生/一時停止">▶</button>
    <button id="to-a" aria-label="ループの頭に戻る">頭に戻る</button>
  </div>
  <div class="row row-a">
    <button id="set-a" class="ab">A</button>
    <button id="a-minus">−0.1</button>
    <button id="a-plus">+0.1</button>
  </div>
  <div class="row row-b">
    <button id="set-b" class="ab">B</button>
    <button id="b-minus">−0.1</button>
    <button id="b-plus">+0.1</button>
  </div>
  <div class="row row-rate">
    <button id="rate-down">−5%</button>
    <button id="rate-value" class="rate-value" aria-label="速度を 100% に戻す">100%</button>
    <button id="rate-up">+5%</button>
  </div>
  <div class="row row-sections">
    <button id="marker-add" aria-label="今の位置に区切りを入れる">＋区切り</button>
    <button id="marker-remove" aria-label="今の位置にいちばん近い区切りを消す">−区切り</button>
    <div id="section-chips" class="section-chips"></div>
  </div>
</main>

<script>window.ytReady = new Promise((resolve) => { window.onYouTubeIframeAPIReady = resolve; });</script>
<script src="https://www.youtube.com/iframe_api"></script>
<!-- 版番号は npm run stamp で書き込む(更新直後に新旧のファイルが混ざらないように) -->
<script type="importmap">
{
  "imports": {
    "./history.js": "./history.js?v=90f72c7a22",
    "./loop.js": "./loop.js?v=90f72c7a22",
    "./player.js": "./player.js?v=90f72c7a22",
    "./sections.js": "./sections.js?v=90f72c7a22",
    "./storage.js": "./storage.js?v=90f72c7a22"
  }
}
</script>
<script type="module" src="app.js?v=90f72c7a22"></script>
</body>
</html>
